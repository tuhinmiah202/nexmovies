# fly.toml app configuration file generated for moviebox-frontend on 2026-07-30T23:40:30+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moviebox-frontend'
primary_region = 'sin'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '7860'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

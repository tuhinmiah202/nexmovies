<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD-MovieBox - Watch Movies & TV Shows Online</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="overlay-nav.css">
  <!-- ArtPlayer -->
  <script src="https://cdn.jsdelivr.net/npm/artplayer@5.1.7/dist/artplayer.min.js"></script>
  <!-- dash.js for DASH streaming -->
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  <!-- hls.js for transcoded HLS fallback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <!-- ArtPlayer DASH control plugin -->
  <script src="https://cdn.jsdelivr.net/npm/artplayer-plugin-dash-control@1.1.0/dist/artplayer-plugin-dash-control.min.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="image-1.apJjVir2.svg" alt="HD-MovieBox" class="logo-icon logo-icon-img">
      <span class="logo-word"><span class="logo-hd">HD</span><span class="logo-dash">-</span>Movie<span class="text-green">Box</span></span>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <select id="langSelect">
        <option value="en">ENGLISH</option>
        <option value="hi">हिन्दी</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
      </select>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-page="tv">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <span>TV show</span>
      </a>
      <a href="#" class="nav-item" data-page="movie">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
        <span>Movie</span>
      </a>
      <a href="#" class="nav-item" data-page="animation">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/></svg>
        <span>Animation</span>
      </a>
      <a href="#" class="nav-item" data-page="trending">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
        <span>Most Watched</span>
      </a>
      <a href="#" class="nav-item" data-page="top-imdb">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <span>Top IMDB Rated</span>
      </a>
      <a href="#" class="nav-item" data-page="hindi">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
        <span>Hindi Dubbed</span>
      </a>
      <a href="#" class="nav-item" data-page="categories">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
        <span>Categories</span>
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item nav-disabled" title="Not available right now">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
        <span>MovieBox App</span>
      </a>
      <a href="#" class="nav-item nav-disabled" title="Not available right now">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4v2h-2V4H8v2H6V4H4v18h16V4h-2zM8 18H6v-2h2v2zm0-4H6v-2h2v2zm6 4h-4v-2h4v2zm0-4h-4v-2h4v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
        <span>Moviebox TV APK</span>
      </a>
      <a href="#" class="nav-item nav-disabled" title="Not available right now">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>FM Download</span>
      </a>
      <a href="#" class="nav-item nav-disabled" title="Not available right now">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Games</span>
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item nav-featured nav-disabled" title="Not available right now">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        <span>Premium Center</span>
      </a>
    </nav>

    <!-- Get MovieBox Section -->
    <div class="sidebar-bottom">
      <div class="get-app-box">
        <div class="get-app-title">Get MovieBox</div>
        <a href="#" class="get-app-btn get-app-main">
          <div class="get-app-btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
          </div>
          <div class="get-app-btn-text">
            <span class="get-app-btn-title">MovieBox ...</span>
            <span class="get-app-btn-sub">For mobile & de...</span>
          </div>
          <svg class="get-app-btn-arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>
        <a href="#" class="get-app-btn get-app-tv">
          <div class="get-app-btn-icon tv-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          </div>
          <div class="get-app-btn-text">
            <span class="get-app-btn-title">TV APK</span>
            <span class="get-app-btn-sub">Android TV</span>
          </div>
        </a>
      </div>
    </div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>

  <main class="main-content">
    <header class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search movies/ TV Shows" />
      </div>
      <div class="topbar-actions">
        <a href="#" class="topbar-btn btn-premium soon-faded" title="Not available right now">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          Go Premium
        </a>
        <a href="#" class="topbar-btn btn-download soon-faded" title="Not available right now">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Download App
        </a>
        <a href="#" class="topbar-btn btn-login">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Log in
        </a>
      </div>
    </header>

    <div class="content-area" id="contentArea">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading movies...</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="overlay-nav.js"></script>
</body>
</html>
